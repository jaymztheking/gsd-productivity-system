# cloudflared runs in-cluster rather than as a systemd service on a node, so it
# inherits Kubernetes restart, reschedule and boot behaviour and reaches its
# origins over cluster DNS without leaving the cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflared
spec:
  # Two connectors on one tunnel, so a single node reboot does not drop the
  # tunnel. Cloudflare load-balances across registered connectors.
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      # Spread the replicas across nodes; without this both can land on one
      # node and the redundancy is illusory.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: cloudflared
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          args:
            - tunnel
            - --config
            - /etc/cloudflared/config.yaml
            - --no-autoupdate
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-token
                  key: token
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared
              readOnly: true
          # cloudflared serves its own health endpoint on the metrics port.
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: cloudflared-config
