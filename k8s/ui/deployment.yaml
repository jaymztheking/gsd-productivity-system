# Build with the production Dockerfile (not Dockerfile.dev):
#   docker buildx build --platform linux/arm64 -t jaymztheking/gsd-ui:latest --push ./ui
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: gsd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      containers:
        - name: ui
          image: jaymztheking/gsd-ui:latest
          ports:
            - containerPort: 3000
          env:
            # Rendered into the nginx config at startup by envsubst so the
            # proxy can attach the token server-side. Never reaches the browser.
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gsd-secrets
                  key: API_TOKEN
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
